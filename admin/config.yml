        label: "Solárium"
        file: "solarium/solarium.md"
        fields:
          - { label: "Nadpis", name: "title", widget: "string" }
          - { label: "Text", name: "body", widget: "markdown" }
      - name: "solarium-kremy"
        label: "Krémy"
        file: "solarium/kremy.md"
        fields:
          - { label: "Nadpis", name: "title", widget: "string" }
