        fields:
          - { label: "Nadpis", name: "title", widget: "string" }
          - { label: "Popis", name: "body", widget: "markdown" }
          - label: "Ceník"
            name: "pricing"
            widget: "list"
            fields:
              - { label: "Služba", name: "service", widget: "string" }
              - { label: "Délka", name: "duration", widget: "string" }
              - { label: "Cena", name: "price", widget: "string" }
