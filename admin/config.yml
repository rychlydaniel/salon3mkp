backend:
  name: git-gateway
  branch: main

locale: "cs"
media_folder: "assets/images"
public_folder: "/assets/images"

collections:
  # ── Manikúra & Pedikúra ──
  - name: "manipedi"
    label: "Manikúra & Pedikúra"
    files:
      - name: "manipedi-index"
        label: "Úvodní stránka"
        file: "manipedi/index.md"
        fields:
          - { label: "Nadpis", name: "title", widget: "string" }
      - name: "manipedi-pedikura"
        label: "Pedikúra"
        file: "manipedi/pedikura.md"
        fields:
          - { label: "Nadpis", name: "title", widget: "string" }
          - { label: "Text", name: "body", widget: "markdown" }
      - name: "manipedi-manikura"
        label: "Manikúra"
        file: "manipedi/manikura.md"
        fields:
          - { label: "Nadpis", name: "title", widget: "string" }
          - { label: "Text", name: "body", widget: "markdown" }
      - name: "manipedi-parafin"
        label: "Parafínové zábaly"
        file: "manipedi/parafinove-zabaly.md"
        fields:
          - { label: "Nadpis", name: "title", widget: "string" }
          - { label: "Text", name: "body", widget: "markdown" }
      - name: "manipedi-epilace"
        label: "Epilace"
        file: "manipedi/epilace.md"
        fields:
          - { label: "Nadpis", name: "title", widget: "string" }
          - { label: "Text", name: "body", widget: "markdown" }
      - name: "manipedi-pojistovna"
        label: "Příspěvek pojišťovny"
        file: "manipedi/prispevek-pojistovny.md"
        fields:
          - { label: "Nadpis", name: "title", widget: "string" }
          - { label: "Text", name: "body", widget: "markdown" }
      - name: "manipedi-poukazy"
        label: "Dárkové poukazy"
        file: "manipedi/darkove-poukazy.md"
        fields:
          - { label: "Nadpis", name: "title", widget: "string" }
          - { label: "Text", name: "body", widget: "markdown" }
      - name: "manipedi-kontakt"
        label: "Kontakt"
        file: "manipedi/kontakt.md"
        fields:
          - { label: "Telefon", name: "phone", widget: "string" }
          - { label: "Adresa", name: "address", widget: "string" }
          - { label: "PSČ", name: "zip", widget: "string" }
          - { label: "IČO", name: "ico", widget: "string" }
          - { label: "Otevírací doba", name: "hours", widget: "string" }

  # ── Solárium ──
  - name: "solarium"
    label: "Solárium"
    files:
      - name: "solarium-index"
