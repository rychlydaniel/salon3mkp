<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrace - Salon 3MKP</title>
    <style>
        body { margin: 0; }
        #loading {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Segoe UI', sans-serif;
            color: #666;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div id="loading">Načítám administraci...</div>
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <script>
        // Zachytí invite/recovery token PŘED načtením CMS
        if (window.location.hash.match(/(invite|recovery)_token=/)) {
            netlifyIdentity.on('init', function() {
                netlifyIdentity.open();
            });
            netlifyIdentity.on('login', function() {
                window.location.href = '/admin/';
            });
        }
    </script>
    <script src="https://unpkg.com/decap-cms@^3.3.0/dist/decap-cms.js"></script>
</body>
</html>
